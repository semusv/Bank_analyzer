spring:
  application:
    name: bank-analyzer

  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: jdbc:h2:mem:bankdb

  h2:
    console:
      enabled: true
      path: /h2-console

  liquibase:
    enabled: true
    contexts: dev

  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true