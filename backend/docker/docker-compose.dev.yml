# backend/docker/docker-compose.dev.yml
services:
  pg-db:
    # Переменные берём из .env.dev
    env_file:
      - ./env/.env.dev
    ports:
      - "5432:5432"           # открываем порт для отладки

  pgadmin:
    env_file:
      - ./env/.env.dev
    ports:
      - "5050:80"           # http://localhost:5080