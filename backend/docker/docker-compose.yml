services:
  pg-db:
    image: postgres:16
    container_name: pg-db-bank
    restart: unless-stopped
    networks:
      - bank_analyzer-network
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "bank_analyze"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    env_file: ../env/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pg-admin-bank
    restart: unless-stopped
    depends_on:
      - pg-db
    networks:
      - bank_analyzer-network
    ports:
      - "5050:80"
    volumes:
      - ./docker/pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin_data/servers.json:/pgadmin4/servers.json
    healthcheck:
      test: curl -f http://localhost:80/misc/ping
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    env_file: ../env/.env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

networks:
  bank_analyzer-network:
    driver: bridge
    attachable: true
    external: true

volumes:
  pgdata:
  pgadmin_data:

