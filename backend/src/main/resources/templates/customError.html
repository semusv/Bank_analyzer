<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Ошибка - Bank Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <meta name="locale" th:content="${#locale}">
    <meta name="language" th:content="${#locale.language}">
    <meta name="country" th:content="${#locale.country}">
</head>

<body class="bg-light">
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4 text-black">
                        <i class="fas fa-chart-line"></i> Bank Analyzer
                    </h2>

                    <!-- Блок ошибок и уведомлений -->
                    <div th:if="${error}" class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-triangle"></i>
                        <span th:text="${error}"></span>
                    </div>
                    <div th:if="${message}" class="alert alert-info" role="alert">
                        <i class="fas fa-info-circle"></i>
                        <span th:text="${message}"></span>
                    </div>
                    <div th:if="${success}" class="alert alert-success" role="alert">
                        <i class="fas fa-check-circle"></i>
                        <span th:text="${success}"></span>
                    </div>

                    <!-- Дополнительные параметры ошибок -->
                    <div th:if="${status}" class="alert alert-warning" role="alert">
                        <i class="fas fa-exclamation-circle"></i>
                        <strong>Статус:</strong> <span th:text="${status}"></span>
                    </div>
                    <div th:if="${path}" class="alert alert-secondary" role="alert">
                        <i class="fas fa-route"></i>
                        <strong>Путь:</strong> <span th:text="${path}"></span>
                    </div>
                    <div th:if="${timestamp}" class="alert alert-secondary" role="alert">
                        <i class="fas fa-clock"></i>
                        <strong>Время:</strong> <span th:text="${timestamp}"></span>
                    </div>

                    <!-- Основное сообщение об ошибке -->
                    <div class="alert alert-danger text-center" role="alert">
                        <i class="fas fa-bug fa-2x mb-3"></i>
                        <h4 class="alert-heading">Произошла ошибка</h4>
                        <p class="mb-0">При обработке вашего запроса возникла непредвиденная ошибка.</p>
                    </div>

                    <!-- Действия -->
                    <div class="d-grid gap-2">
                        <a href="/" class="btn btn-outline-secondary">
                            <i class="fas fa-home"></i> На главную
                        </a>
                    </div>

                    <!-- Техническая информация (для разработки) -->
                    <div th:if="${exception}" class="mt-4">
                        <details class="alert alert-light">
                            <summary class="text-muted">Техническая информация</summary>
                            <div class="mt-2">
                                <small>
                                    <strong>Исключение:</strong> <span th:text="${exception}"></span><br>
                                    <th:block th:if="${trace}">
                                        <strong>Трассировка:</strong><br>
                                        <pre class="small text-muted mt-2" th:text="${trace}"></pre>
                                    </th:block>
                                </small>
                            </div>
                        </details>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Дополнительный контейнер для уведомлений -->
<div class="notification-container" id="notification-container"></div>

</body>
</html>
