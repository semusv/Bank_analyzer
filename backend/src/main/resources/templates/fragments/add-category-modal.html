<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<div class="modal fade" id="addCategoryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Добавить категорию</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="addCategoryForm">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="addCategoryName" class="form-label">Название *</label>
                        <input type="text" class="form-control" id="addCategoryName" name="name" required
                            placeholder="Например: Продукты">
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="addBackgroundColor">Цвет фона *</label>
                        <div id="backgroundColorPicker" class="color-picker-grid mb-2"></div>
                        <input type="color" class="form-control form-control-color" id="addBackgroundColor"
                            name="backgroundColor" value="#FFE4E1" title="Выберите цвет фона">
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="addTextColor">Цвет текста *</label>
                        <div id="textColorPicker" class="color-picker-grid mb-2"></div>
                        <input type="color" class="form-control form-control-color" id="addTextColor" name="textColor"
                            value="#333333" title="Выберите цвет текста">
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="addPreviewBadge">Предпросмотр</label>
                        <div class="category-preview" id="addCategoryPreview">
                            <span class="badge" id="addPreviewBadge">Название категории</span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-primary">Добавить</button>
                </div>
            </form>
        </div>
    </div>
</div>
