<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<!-- Модальное окно добавления транзакции -->
<div class="modal fade" id="addTransactionModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Добавить транзакцию</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="addTransactionForm">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label" for="type-selection">Тип операции *</label>
                        <fieldset class="btn-group w-100" id="type-selection">
                            <input type="radio" class="btn-check" name="operationType" id="expenseType" value="0"
                                checked>
                            <label class="btn btn-outline-danger" for="expenseType">Расход</label>

                            <input type="radio" class="btn-check" name="operationType" id="incomeType" value="1">
                            <label class="btn btn-outline-success" for="incomeType">Доход</label>

                            <input type="radio" class="btn-check" name="operationType" id="transferType" value="2">
                            <label class="btn btn-outline-primary" for="transferType">Перевод</label>
                        </fieldset>
                    </div>


                    <div class="mb-3">
                        <label for="addDescription" class="form-label">Описание *</label>
                        <input type="text" class="form-control" id="addDescription" name="description" required
                            placeholder="Например: Пятерочка">
                    </div>
                    <div class="mb-3">
                        <label for="addAmount" class="form-label">Сумма *</label>
                        <input type="number" step="0.01" class="form-control amount text-danger" id="addAmount"
                            name="amount" onblur="this.value = parseFloat(this.value).toFixed(2)" required
                            placeholder="100.00">
                    </div>
                    <div class="mb-3">
                        <label for="addOperationTime" class="form-label">Дата и время *</label>
                        <input type="datetime-local" class="form-control" id="addOperationTime" name="operationTime"
                            required>
                    </div>
                    <div class="mb-3">
                        <div class="dropdown">
                            <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start" type="button"
                                id="categoryDropdownBtn" data-bs-toggle="dropdown">
                                Выберите категорию
                            </button>
                            <div class="dropdown-menu w-100" id="categoryDropdownMenu">
                                <a class="dropdown-item" href="#" data-value="">Не выбрано</a>
                            </div>
                            <input type="hidden" id="addCategoryId" name="categoryId">
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="dropdown">
                            <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start" type="button"
                                id="cardDropdownBtn" data-bs-toggle="dropdown">
                                Выберите карту
                            </button>
                            <div class="dropdown-menu w-100" id="cardDropdownMenu">
                                <a class="dropdown-item" href="#" data-value="">Не выбрано</a>
                            </div>
                            <input type="hidden" id="addCardId" name="cardId">
                        </div>
                    </div>



                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-primary">Добавить</button>
                </div>
            </form>
        </div>
    </div>
</div>
