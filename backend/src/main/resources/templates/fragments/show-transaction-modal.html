<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<!-- Модальное окно деталей транзакции -->
<div class="modal fade" id="transactionDetailsModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Детали транзакции</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label fw-bold" for="detailDescription">Описание</label>
                    <p id="detailDescription"></p>
                </div>
                <div class="mb-3">
                    <div id="viewAmountContainer">
                        <label class="form-label fw-bold" for="detailAmount">Сумма</label>
                        <strong>
                            <p id="detailAmount" class="amount"></p>
                        </strong>
                    </div>
                    <div id="editAmountContainer" style="display: none;">
                        <label for="addAmount" class="form-label">Сумма *</label>
                        <input type="number" step="0.01" class="form-control amount text-danger" id="addAmount"
                            name="amount" onblur="this.value = parseFloat(this.value).toFixed(2)" required
                            placeholder="100.00">
                    </div>
                </div>

                <div class="mb-3">
                    <div id="viewDateTimeContainer">
                        <label class="form-label fw-bold" for="detailDateTime">Дата и время</label>
                        <p id="detailDateTime"></p>
                    </div>

                    <div id="editDateTimeContainer" style="display: none;">
                        <label for="addOperationTime" class="form-label">Дата и время *</label>
                        <input type="datetime-local" class="form-control" id="addOperationTime" name="operationTime"
                            required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold" for="detailBank">Банк</label>
                    <p id="detailBank">
                        <span class="badge" id="detailBankBadge">
                        </span>
                    </p>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold" for="detailCard">Карта</label>
                    <p id="detailCard"></p>
                </div>
                <div class="mb-3">
                    <div id="viewCategoryContainer">
                        <label class="form-label fw-bold" for="detailCategory">Категория</label>
                        <p id="detailCategory"></p>
                    </div>

                    <div id="editCategoryContainer" style="display: none;">
                        <div class="dropdown">
                            <label for="addCategoryId" class="form-label">Категория</label>
                            <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start" type="button"
                                id="categoryDropdownBtn" data-bs-toggle="dropdown">
                                Выберите категорию
                            </button>
                            <div class="dropdown-menu w-100" id="categoryDropdownMenu">
                                <a class="dropdown-item" href="#" data-value="">Не выбрано</a>
                            </div>
                            <input type="hidden" id="addCategoryId" name="categoryId">
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold" for="detailHideStatus">Статус видимости</label>
                    <p id="detailHideStatus"></p>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="detailHide" disabled>
                        <label class="form-check-label" for="detailHide">
                            Скрыто из статистики
                        </label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                <button type="button" class="btn btn-primary" id="editTransactionBtn">
                    <i class="fas fa-edit"></i> Редактировать
                </button>
                <button type="button" class="btn btn-success" id="saveTransactionBtn" style="display: none;">
                    <i class="fas fa-save"></i> Сохранить
                </button>
                <button type="button" class="btn btn-warning" id="toggleHideBtn">
                    <i class="fas fa-eye-slash"></i> Изменить видимость
                </button>
                <button type="button" class="btn btn-info" id="splitTransactionBtn">
                    <i class="fas fa-cut"></i> Разделить
                </button>
            </div>
        </div>
    </div>
</div>
