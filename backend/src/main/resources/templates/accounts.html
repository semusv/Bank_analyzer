<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">

<head th:replace="~{layout :: head}">

    <title>Счета и карты - Bank Analyzer</title>
</head>

<body>
    <nav th:replace="~{layout :: topnav}"></nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Меню слева -->
            <nav class="sidebar collapse" th:replace="~{layout :: sidebar}">
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-3 main-content">
                <!-- Заголовок и кнопка добавления -->
                <div
                    class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">
                        <i class="fas fa-credit-card"></i> Счета и карты
                    </h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <button class="btn btn-sm btn-primary" onclick="openAddAccountModal()">
                            <i class="fas fa-plus"></i> Добавить счет
                        </button>
                    </div>
                </div>

                <!-- Сообщения -->
                <div id="alertContainer"></div>

                <!-- Список счетов -->
                <div class="row" id="accountsContainer">
                    <div class="col-12">
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Загрузка...</span>
                            </div>
                            <p class="mt-2 text-muted">Загрузка счетов...</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Модальное окно добавления счета -->
    <div class="modal fade" id="addAccountModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Добавить новый счет</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="addAccountForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="accountName" class="form-label">Название счета *</label>
                            <input type="text" class="form-control" id="accountName" name="accountName" required
                                placeholder="Например: Основной счет RUB">
                        </div>
                        <div class="mb-3">
                            <label for="accountNumber" class="form-label">Номер счета *</label>
                            <input type="text" class="form-control" id="accountNumber" name="accountNumber" required
                                placeholder="40817810099910004321">
                        </div>
                        <div class="mb-3">
                            <label for="bank-list" class="form-label">Банк *</label>
                            <select class="form-select" id="bank-list" name = "bankId" required>
                                <option value="">Выберите банк</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="currency-list" class="form-label">Валюта *</label>
                            <select class="form-select" id="currency-list" name = "currencyId" required>
                                <option value="">Выберите валюту счета</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="initialBalance" class="form-label">Начальный баланс</label>
                            <input type="number" step="0.01" class="form-control" id="initialBalance"
                                name="initialBalance" value="0.00" placeholder="0.00">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                        <button type="submit" class="btn btn-primary">Добавить счет</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Модальное окно добавления карты -->
    <div class="modal fade" id="addCardModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Добавить карту к счету</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="addCardForm">
                    <input type="hidden" id="cardAccountId" name="cardAccountId">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="cardName" class="form-label">Название карты *</label>
                            <input type="text" class="form-control" id="cardName" name="cardName" required
                                placeholder="Например: Tinkoff Black">
                        </div>
                        <div class="mb-3">
                            <label for="lastFourDigits" class="form-label">Последние 4 цифры *</label>
                            <input type="text" class="form-control" id="lastFourDigits" name="lastFourDigits" required
                                maxlength="4" pattern="[0-9]{4}" placeholder="1234">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                        <button type="submit" class="btn btn-primary">Добавить карту</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="notification-container" id="notification-container"></div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script type="module" src="../static/js/ui/accounts-view.js" th:src="@{/js/ui/accounts-view.js}"></script>
</body>

</html>
