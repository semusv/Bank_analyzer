<!DOCTYPE html>
<!--suppress ALL -->
<html xmlns:th="http://www.thymeleaf.org" lang="ru">

<head th:replace="~{layout :: head}">
    <title>Транзакции - Bank Analyzer</title>
    <link th:href="@{/css/transactions.css}" rel="stylesheet">
</head>

<body>
    <div th:replace="~{layout :: topnav}"></div>

    <div class="container-fluid">
        <div class="row">
            <div th:replace="~{layout :: sidebar}"></div>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
                <!-- Заголовок и кнопка добавления -->
                <div
                    class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">
                        <i class="fas fa-exchange-alt"></i> Транзакции
                    </h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <button class="btn btn-sm btn-primary" onclick="openAddTransactionModal()">
                            <i class="fas fa-plus"></i> Добавить транзакцию
                        </button>
                    </div>
                </div>

                <!-- Сообщения -->
                <div id="alertContainer"></div>

                <!-- Фильтры -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">Фильтры</h5>
                    </div>
                    <div class="card-body">
                        <form id="filterForm">
                            <div class="row g-3">
                                <div class="col-12 col-md-6 col-lg-3">
                                    <label for="filterStartDate" class="form-label">Дата с</label>
                                    <input type="date" class="form-control" id="filterStartDate" name="startDate">
                                </div>
                                <div class="col-12 col-md-6 col-lg-3">
                                    <label for="filterEndDate" class="form-label">Дата по</label>
                                    <input type="date" class="form-control" id="filterEndDate" name="endDate">
                                </div>
                                <div class="col-12 col-md-6 col-lg-3">
                                    <label for="filterCard" class="form-label">Карта</label>
                                    <select class="form-select" id="filterCard" name="cardId">
                                        <option value="">Все карты</option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-6 col-lg-3">
                                    <label for="filterBank" class="form-label">Банк</label>
                                    <select class="form-select" id="filterBank" name="bankId">
                                        <option value="">Все банки</option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-6 col-lg-3">
                                    <label for="filterCategory" class="form-label">Категория</label>
                                    <select class="form-select" id="filterCategory" name="categoryId">
                                        <option value="">Все категории</option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-6 col-lg-3">
                                    <label for="filterDescription" class="form-label">Описание</label>
                                    <input type="text" class="form-control" id="filterDescription" name="description"
                                        placeholder="Поиск по описанию">
                                </div>
                                <div class="col-12 col-md-6 col-lg-6 d-flex align-items-end">
                                    <button type="submit" class="btn btn-primary me-2">
                                        <i class="fas fa-filter"></i> Применить
                                    </button>
                                    <button type="button" class="btn btn-secondary" id="clearFilters">
                                        <i class="fas fa-times"></i> Очистить
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Список транзакций -->
                <div id="transactionsContainer">
                    <div class="col-12">
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Загрузка данных...</span>
                            </div>
                            <p class="mt-2 text-muted">Загрузка транзакций...</p>
                        </div>
                    </div>
                </div>

                <!-- Пагинация -->
                <div id="paginationContainer" class="mt-4"></div>
            </main>
        </div>
    </div>

    <!-- Модальное окно добавления транзакции -->
    <div class="modal fade" id="addTransactionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Добавить транзакцию</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="addTransactionForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="addDescription" class="form-label">Описание *</label>
                            <input type="text" class="form-control" id="addDescription" name="description" required
                                placeholder="Например: Пятерочка">
                        </div>
                        <div class="mb-3">
                            <label for="addAmount" class="form-label">Сумма *</label>
                            <input type="number" step="0.01" class="form-control" id="addAmount" name="amount" required
                                placeholder="100.00">
                        </div>
                        <div class="mb-3">
                            <label for="addOperationTime" class="form-label">Дата и время *</label>
                            <input type="datetime-local" class="form-control" id="addOperationTime" name="operationTime"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="addCurrencyId" class="form-label">Валюта *</label>
                            <select class="form-select" id="addCurrencyId" name="currencyId" required>
                                <option value="">Выберите валюту</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="addCategoryId" class="form-label">Категория</label>
                            <select class="form-select" id="addCategoryId" name="categoryId">
                                <option value="">Не выбрано</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="addCardId" class="form-label">Карта</label>
                            <select class="form-select" id="addCardId" name="cardId">
                                <option value="">Не выбрано</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                        <button type="submit" class="btn btn-primary">Добавить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Модальное окно деталей транзакции -->
    <div class="modal fade" id="transactionDetailsModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Детали транзакции</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Описание</label>
                        <p id="detailDescription"></p>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Сумма</label>
                        <p id="detailAmount"></p>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Дата и время</label>
                        <p id="detailDateTime"></p>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Банк</label>
                        <p id="detailBank"></p>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Карта</label>
                        <p id="detailCard"></p>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Категория</label>
                        <p id="detailCategory"></p>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Статус видимости</label>
                        <p id="detailHideStatus"></p>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="detailHide" disabled>
                            <label class="form-check-label" for="detailHide">
                                Скрыть из статистики
                            </label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                    <button type="button" class="btn btn-warning" id="toggleHideBtn">
                        <i class="fas fa-eye-slash"></i> Изменить видимость
                    </button>
                    <button type="button" class="btn btn-info" id="splitTransactionBtn">
                        <i class="fas fa-cut"></i> Разделить
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно разделения транзакции -->
    <div class="modal fade" id="splitTransactionModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Разделить транзакцию</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="splitTransactionForm">
                    <div class="modal-body">
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle"></i>
                            Введите подтранзакции. Сумма всех подтранзакций должна равняться сумме основной транзакции.
                        </div>
                        <div id="subTransactionsContainer"></div>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="addSubTransaction()">
                            <i class="fas fa-plus"></i> Добавить подтранзакцию
                        </button>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                        <button type="submit" class="btn btn-primary">Разделить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="notification-container" id="notification-container"></div>

    <div th:replace="~{layout :: scripts}"></div>

    <script type="module" th:src="@{/js/ui/transactions-view.js}"></script>
</body>

</html>
