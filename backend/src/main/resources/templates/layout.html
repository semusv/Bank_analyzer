<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<!-- Фрагмент head -->

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Bank Analyzer'">Bank Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>

<!-- Фрагмент topnav -->
<nav th:fragment="topnav" class="navbar navbar-expand-lg navbar-dark bg-dark" aria-label="Навигация заголовок">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">
            <i class="fas fa-chart-line"></i> Bank Analyzer
        </a>
        <div class="navbar-nav ms-auto">
            <span class="navbar-text me-3" th:text="'Привет, ' + ${userName}"></span>
            <a class="btn btn-outline-light btn-sm" href="/logout">Выйти</a>
        </div>
    </div>
</nav>

<!-- Фрагмент sidebar -->
<nav th:fragment="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse" aria-label="Навигация меню">
    <div class="position-sticky pt-3">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a th:class="${activePage == 'dashboard'} ? 'nav-link active' : 'nav-link'" href="/dashboard">
                    <i class="fas fa-tachometer-alt"></i> Дашборд
                </a>
            </li>
            <li class="nav-item">
                <a th:class="${activePage == 'transactions'} ? 'nav-link active' : 'nav-link'" href="/transactions">
                    <i class="fas fa-exchange-alt"></i> Транзакции
                </a>
            </li>
            <li class="nav-item">
                <a th:class="${activePage == 'accounts'} ? 'nav-link active' : 'nav-link'" href="/accounts">
                    <i class="fas fa-credit-card"></i> Счета и карты
                </a>
            </li>
            <li class="nav-item">
                <a th:class="${activePage == 'categories'} ? 'nav-link active' : 'nav-link'" href="/categories">
                    <i class="fas fa-tags"></i> Категории
                </a>
            </li>
            <li class="nav-item">
                <a th:class="${activePage == 'analysis'} ? 'nav-link active' : 'nav-link'" href="/analysis">
                    <i class="fas fa-chart-bar"></i> Аналитика
                </a>
            </li>
        </ul>
    </div>
</nav>

<!-- Фрагмент scripts -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/common.js"></script>
</div>
