<!DOCTYPE html>
<!--suppress ALL -->
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<!-- Фрагмент head -->

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Bank Analyzer'">Bank Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <meta name="locale" th:content="${#locale}">
    <meta name="language" th:content="${#locale.language}">
    <meta name="country" th:content="${#locale.country}">
    <script type="module" th:src="@{/js/ui/layout-view.js}"></script>
</head>

<!-- Фрагмент topnav -->
<nav th:fragment="topnav" class="navbar navbar-expand-lg navbar-dark bg-dark" aria-label="Навигация заголовок">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">
            <i class="fas fa-chart-line"></i> Bank Analyzer
        </a>
        <div class="navbar-nav ms-auto">
            <div class="navbar-nav ms-auto align-items-center">
                <span class="navbar-text me-3" th:text="'Привет, ' + ${userName}"></span>
                <button class="btn btn-outline-light btn-sm" id="logout-btn">Выйти</button>
            </div>
        </div>

        <div id="locale-data" th:data-locale="${#locale}" th:data-language="${#locale.language}"
            th:data-country="${#locale.country}">
        </div>
    </div>
</nav>

<!-- Фрагмент sidebar -->
<nav th:fragment="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar">
    <div class="position-sticky pt-3" id="sidebar">
        <!-- Заголовок сайдбара -->
        <div class="px-3 mb-4">
            <h5 class="text-muted mb-0">Меню</h5>
        </div>

        <ul class="nav flex-column">
            <li class="nav-item">
                <a th:class="${activePage == 'dashboard'} ? 'nav-link active' : 'nav-link'" href="/dashboard">
                    <i class="fas fa-tachometer-alt me-2"></i> Дашборд
                    <span th:if="${activePage == 'dashboard'}"
                        class="position-absolute top-50 end-0 translate-middle-y me-3">
                        <span class="visually-hidden">Текущая страница</span>
                    </span>
                </a>
            </li>
            <li class="nav-item">
                <a th:class="${activePage == 'transactions'} ? 'nav-link active' : 'nav-link'" href="/transactions">
                    <i class="fas fa-exchange-alt me-2"></i> Транзакции
                </a>
            </li>
            <li class="nav-item">
                <a th:class="${activePage == 'accounts'} ? 'nav-link active' : 'nav-link'" href="/accounts">
                    <i class="fas fa-credit-card me-2"></i> Счета и карты
                </a>
            </li>
            <li class="nav-item">
                <a th:class="${activePage == 'categories'} ? 'nav-link active' : 'nav-link'" href="/categories">
                    <i class="fas fa-tags me-2"></i> Категории
                </a>
            </li>
            <li class="nav-item">
                <a th:class="${activePage == 'analytics'} ? 'nav-link active' : 'nav-link'" href="/analytics">
                    <i class="fas fa-chart-bar me-2"></i> Аналитика
                </a>
            </li>
        </ul>

        <!-- Дополнительный раздел-->
        <div class="border-top mt-4 pt-3">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a th:class="${activePage == 'help'} ? 'nav-link active text-muted' : 'nav-link text-muted'"
                        href="/help">
                        <i class="fas fa-question-circle me-2"></i> Помощь
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Фрагмент scripts -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.0.1/dist/chart.umd.min.js"></script>
</div>
