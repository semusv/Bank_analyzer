cbr:
  integration:
    enabled: true
    cbrUrl: https://www.cbr.ru/scripts/XML_daily.asp
    poll-interval: 3600000

jwt:
  secret: ${JWT_SECRET}
  token.expiration.seconds: 3600  # 1 час
  cookie.expiration.seconds: 3600

spring:


  messages:
    baseName: messages
    encoding: UTF-8
    # Не дает свалиться в системную локаль если не найден файл для переданной в MessageSource
    # Если false то будут браться сообщения из дефолтного файла, если true, то из файла соответствующего системной локали
    fallbackToSystemLocale: false

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  application:
    name: bank-analyzer

  thymeleaf:
    cache: false

  output:
    ansi:
      enabled: ALWAYS

  datasource:
    driver-class-name: org.postgresql.Driver
    password: ${SPRING_DATASOURCE_PASSWORD}
    username: ${SPRING_DATASOURCE_USERNAME}
    url: ${SPRING_DATASOURCE_URL}

  liquibase:
    enabled: true
    contexts: dev
    url: ${SPRING_LIQUIBASE_URL}
    user: ${SPRING_LIQUIBASE_USERNAME}
    password: ${SPRING_LIQUIBASE_PASSWORD}

  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

#Шаблон вывода ошибок
app:
  templates:
    error: "static/error-template.txt"

logging:
  level:
    org.springframework.integration: DEBUG
    liquibase: DEBUG
    org.springframework.jdbc.datasource: DEBUG
    org.springframework.liquibase: DEBUG

