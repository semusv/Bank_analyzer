spring:
  application:
    name: bank-analyzer

  output:
    ansi:
      enabled: ALWAYS

  datasource:
    driver-class-name: org.postgresql.Driver
    password: 123456*
    username: admin
    url: jdbc:postgresql://localhost/bank_analyze

  h2:
    console:
      enabled: true
      path: /h2-console

  liquibase:
    enabled: true
    contexts: dev

  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true