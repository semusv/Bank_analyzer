            tableName: users
            defaultNullValue: ''
  - changeSet:
      id: 1753124445562-3
      author: Semenov V
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addUniqueConstraint:
            columnNames: login
            constraintName: UC_USERS_LOGIN
            tableName: users

