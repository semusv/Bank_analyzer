databaseChangeLog:
  - changeSet:
      id: 2025-08-13--0001-currencies-data
      author: vvsemenov
      context: dev
      runOnChange: true
      changes:
        - loadData:
            file: csv/2025-08-13--0001-currencies.csv
            relativeToChangelogFile: true
            separator: ";"
            quotchar: '"'
            encoding: UTF-8
            tableName: currencies
            primaryKey: id
            columns:
              - column:
                  name: code
              - column:
                  name: symbol
              - column:
                  name: name

